<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NSRUDP — Nauru Water Supply GIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 10px 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; max-height: 85vh; overflow-y: auto;
  }
  #panel.closed { display: none; }
  #panel-toggle {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    background: #fff; border: none; border-radius: 8px; padding: 8px 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 14px; cursor: pointer; display: none;
  }
  #panel-close {
    float: right; border: none; background: none; font-size: 18px;
    cursor: pointer; color: #666; padding: 0 0 0 10px; line-height: 1;
  }
  @media (max-width: 640px) {
    #panel { top: 0; left: 0; border-radius: 0 0 8px 0; max-height: 70vh; max-width: 85vw; }
    #panel h1 { font-size: 13px; }
    .maplibregl-popup-content { max-width: 78vw !important; }
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; margin: 3px 0; cursor: pointer; white-space: nowrap; }
  #panel .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  #panel hr { border: none; border-top: 1px solid #ddd; margin: 8px 0; }
  #panel select { width: 100%; margin-top: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<button id="panel-toggle" title="Show layers">☰ Layers</button>
<div id="panel">
  <h1><button id="panel-close" title="Hide panel">×</button>NSRUDP — Nauru Water Supply</h1>
  <div id="layers"></div>
  <hr>
  <label>Basemap
    <select id="basemap">
      <option value="imagery">Esri World Imagery</option>
      <option value="osm">OpenStreetMap</option>
      <option value="none">None (white)</option>
    </select>
  </label>
  <hr>
  <div style="font-size:11px;color:#666">
    Design information only — not "as constructed".<br>Not for excavation or navigation.<br>
    <a href="DATA-NOTICE.pdf" target="_blank">View data notice &amp; terms of use</a> ·
    <a href="DATA-NOTICE.pdf" download="NSRUDP-Data-Notice.pdf">Download</a>
  </div>
</div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// [id, label, color, defaultVisible]
const GROUPS = [
  ["contours",   "Contours (1 m)",      "#c8b273", false],
  ["cadastral",  "Cadastral parcels",   "#e0e0e0", true],
  ["districts",  "Districts",           "#616161", true],
  ["railway",    "Railway",             "#8B4513", true],
  ["fuel_lines", "Fuel lines",          "#ff8c00", true],
  ["future_fuel","Future fuel lines",   "#d4af37", false],
  ["old_pipes",  "Old pipe system",     "#8e24aa", true],
  ["retic",      "Reticulation design", "#1565c0", true],
  ["customers",  "Customer points",     "#d32f2f", false],
  ["ro_intake",  "RO intake",           "#2e7d32", true],
  ["fittings",   "Fittings / valves",   "#111111", true],
  ["key_stage1", "Key plan — Stage 1",  "#e53935", false],
  ["key_stage2", "Key plan — Stage 2",  "#fb8c00", false],
  ["key_stage3", "Key plan — Stage 3",  "#43a047", false],
];

const basemaps = {
  imagery: {
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
    attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
  },
  osm: {
    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
    attribution: "© OpenStreetMap contributors"
  }
};

const map = new maplibregl.Map({
  container: "map",
  center: [166.932, -0.527],
  zoom: 13,
  maxZoom: 19,
  style: {
    version: 8,
    sources: {
      basemap: { type: "raster", tiles: basemaps.imagery.tiles, tileSize: 256, attribution: basemaps.imagery.attribution },
      nsudp: { type: "vector", url: "pmtiles://nsudp.pmtiles" }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#ffffff" } },
      { id: "basemap", type: "raster", source: "basemap" }
    ]
  }
});
map.addControl(new maplibregl.NavigationControl());
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }));

const subLayers = {};  // group id -> [maplibre layer ids]

map.on("load", () => {
  for (const [id, label, color, vis] of GROUPS) {
    const ids = [];
    const visibility = vis ? "visible" : "none";
    const lineWidth = id === "contours" ? 0.5 : id === "cadastral" ? 0.7 :
                      (id === "districts" || id === "railway") ? 2 : 2.2;
    const opacity = id === "contours" ? 0.55 : id === "cadastral" ? 0.85 : 0.95;
    if (id !== "fittings") { // fittings: valve points only, hide construction polylines
      map.addLayer({
        id: id + "-line", type: "line", source: "nsudp", "source-layer": id,
        filter: ["!=", ["geometry-type"], "Point"],
        layout: { visibility },
        paint: { "line-color": color, "line-width": lineWidth, "line-opacity": opacity }
      });
      ids.push(id + "-line");
    }
    map.addLayer({
      id: id + "-pt", type: "circle", source: "nsudp", "source-layer": id,
      filter: ["==", ["geometry-type"], "Point"],
      layout: { visibility },
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 12, 1.5, 16, 4.5],
        "circle-color": color,
        "circle-opacity": 0.9
      }
    });
    ids.push(id + "-pt");
    subLayers[id] = ids;
  }

  // layer toggle panel
  const holder = document.getElementById("layers");
  for (const [id, label, color, vis] of GROUPS) {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" ${vis ? "checked" : ""} data-id="${id}">
      <span class="swatch" style="background:${color}"></span>${label}`;
    l.querySelector("input").addEventListener("change", e => {
      const v = e.target.checked ? "visible" : "none";
      for (const lid of subLayers[id]) map.setLayoutProperty(lid, "visibility", v);
    });
    holder.appendChild(l);
  }

  // identify: query all visible layers within a small radius of the click
  const GROUP_LABEL = Object.fromEntries(GROUPS.map(g => [g[0], g[1]]));
  const featureCard = f => {
    const p = f.properties;
    let title = p.type || GROUP_LABEL[f.sourceLayer] || f.sourceLayer;
    let badges = "";
    if (p.diameter) badges += `<span style="background:#1565c0;color:#fff;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px">${p.diameter} mm</span>`;
    if (p.status) badges += `<span style="background:${p.status==="Abandoned"?"#8e24aa":p.status==="Proposed"?"#d4af37":"#2e7d32"};color:#fff;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px">${p.status}</span>`;
    if (p.elevation_m != null) badges += `<span style="background:#795548;color:#fff;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px">${p.elevation_m} m</span>`;
    const detail = [];
    if (p.stage) detail.push(`Stage ${p.stage}${p.route ? " — " + p.route : ""}`);
    if (p.block) detail.push(`Block: ${p.block}`);
    if (p.text) detail.push(p.text);
    detail.push(`<span style="color:#999">CAD layer: ${p.cad_layer || "—"} · ${GROUP_LABEL[f.sourceLayer]}</span>`);
    return `<div style="border-top:1px solid #eee;padding:6px 0">
      <b>${title}</b>${badges}
      <div style="font-size:12px;margin-top:2px">${detail.join("<br>")}</div></div>`;
  };
  map.on("click", e => {
    const R = 6; // px hit tolerance
    const bbox = [[e.point.x - R, e.point.y - R], [e.point.x + R, e.point.y + R]];
    const active = Object.values(subLayers).flat()
      .filter(lid => map.getLayoutProperty(lid, "visibility") !== "none");
    const fs = map.queryRenderedFeatures(bbox, { layers: active });
    if (!fs.length) return;
    // dedupe (same feature can appear across tile boundaries)
    const seen = new Set(); const uniq = [];
    for (const f of fs) {
      const key = f.sourceLayer + "|" + JSON.stringify(f.properties);
      if (!seen.has(key)) { seen.add(key); uniq.push(f); }
      if (uniq.length >= 10) break;
    }
    const header = `<div style="font-size:11px;color:#777;margin-bottom:2px">${uniq.length} feature${uniq.length > 1 ? "s" : ""} at this location</div>`;
    new maplibregl.Popup({ maxWidth: "320px" }).setLngLat(e.lngLat)
      .setHTML(`<div style="max-height:260px;overflow-y:auto">${header}${uniq.map(featureCard).join("")}</div>`).addTo(map);
  });
  map.on("mousemove", e => {
    const fs = map.queryRenderedFeatures(e.point, { layers: Object.values(subLayers).flat() });
    map.getCanvas().style.cursor = fs.length ? "pointer" : "";
  });
});

// collapsible panel (starts closed on small screens)
const panel = document.getElementById("panel");
const toggle = document.getElementById("panel-toggle");
const setPanel = open => {
  panel.classList.toggle("closed", !open);
  toggle.style.display = open ? "none" : "block";
};
document.getElementById("panel-close").addEventListener("click", () => setPanel(false));
toggle.addEventListener("click", () => setPanel(true));
setPanel(false);

// basemap switcher
document.getElementById("basemap").addEventListener("change", e => {
  const v = e.target.value;
  if (v === "none") { map.setLayoutProperty("basemap", "visibility", "none"); return; }
  map.setLayoutProperty("basemap", "visibility", "visible");
  map.getSource("basemap").setTiles(basemaps[v].tiles);
});
</script>
</body>
</html>
